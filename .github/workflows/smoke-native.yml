name: Studio — existing native packages smoke (manual)

# No compilation or deployment. Three eight-minute jobs = 24 runner-min ceiling.
# Reuses the exact candidate hashes; uploaded diagnostics never include audio.
on:
  workflow_dispatch:
    inputs:
      confirm_budget:
        description: Approve isolated runtime tests of existing candidates
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-native-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: ${{ inputs.confirm_budget }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            package: rasgo-synth-studio-0.1.1-windows-x64.exe
            sha256: b87e495d3de34722dcaeca9aab5df83c25ee02b51f4b10bd9b36117e36065126
          - runner: macos-15-intel
            platform: macos-x86_64
            package: rasgo-synth-studio-0.1.1-macos-universal.dmg
            sha256: c818640b5b8ec5608b664df5c815be5963818d6b6b9f2b85c0f24bbc4f84a5c9
          - runner: macos-15
            platform: macos-arm64
            package: rasgo-synth-studio-0.1.1-macos-universal.dmg
            sha256: c818640b5b8ec5608b664df5c815be5963818d6b6b9f2b85c0f24bbc4f84a5c9
    runs-on: ${{ matrix.runner }}
    env:
      STUDIO_PACKAGE: ${{ matrix.package }}
      STUDIO_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the fixed public release, not expired candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v0.1.1 --repo "$GITHUB_REPOSITORY" \
            --pattern "$STUDIO_PACKAGE" --dir .local-build/candidates
      - name: Verify exact existing package before execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = Join-Path "$pwd/.local-build/candidates" $env:STUDIO_PACKAGE
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:STUDIO_SHA256) { throw "Candidate SHA256 mismatch" }
      - name: Install Windows candidate in private runner directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path "$pwd/.local-build/candidates" $env:STUDIO_PACKAGE
          $target = [System.IO.Path]::GetFullPath((Join-Path $pwd '.local-build\installed-studio'))
          # NSIS requires /D last. Only the disposable runner registry is used.
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$target") -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw "NSIS timeout" }
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed" }
          $binary = Join-Path $target 'Rasgo Synth Studio.exe'
          $deadline = [DateTime]::UtcNow.AddSeconds(20)
          while (!(Test-Path $binary) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (!(Test-Path $binary)) {
            if (Test-Path $target) { Get-ChildItem $target -Recurse -File | Select-Object -First 60 FullName }
            throw "NSIS completed without the expected executable in its explicit native destination"
          }
          python -B tools/smoke_studio_native.py --binary "$target/Rasgo Synth Studio.exe" --output "$pwd/.local-build/native-smoke"
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime smoke failed" }
      - name: Mount DMG read-only, copy bundle, render and close
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$PWD/.local-build/dmg-mount"
          mkdir "$mountpoint"
          # CPack adds the author's AGPL notice as a DMG license prompt.
          # Explicitly acknowledge it in this disposable test, not by changing
          # the license, image, Gatekeeper or host security policy.
          printf 'Y\n' | hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" ".local-build/candidates/$STUDIO_PACKAGE"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto "$mountpoint/Rasgo Synth Studio.app" "$PWD/.local-build/installed-studio.app"
          bundle="$PWD/.local-build/installed-studio.app"
          python -B tools/smoke_studio_native.py --binary "$bundle/Contents/MacOS/Rasgo Synth Studio" \
            --bundle "$bundle" --output "$PWD/.local-build/native-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.platform }}-runtime-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            .local-build/native-smoke/report.json
            .local-build/native-smoke/launcher.log
            .local-build/native-smoke/dados-*/lifecycle-history.jsonl
            .local-build/native-smoke/dados-*/Logs/*.log
