<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Da semente ao arquivo — referência histórica</title>
<desc id="desc">Seed alimenta DSP, sequenciamento e arco. Arco alimenta os pesos de jogo e a mixagem; os pesos enviesam DSP e sequenciamento. DSP e sequenciamento chegam à mixagem e ao PieceRenderer, que alimenta app e álbum. Relações completas na notação textual acompanhante.</desc>
